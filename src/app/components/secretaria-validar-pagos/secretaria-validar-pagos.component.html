<div class="page">
  <header class="header">
    <h1>Validar Pagos (Transferencia)</h1>
    <button class="btn btn-secondary" routerLink="/secretaria/dashboard">Volver</button>
  </header>

  <div class="card filtros">
    <div class="row">
      <div class="field">
        <label>Estado</label>
        <select [(ngModel)]="filtroEstado" (change)="cargar()">
          <option value="pendiente">pendiente</option>
          <option value="procesando">procesando</option>
          <option value="completado">completado</option>
          <option value="rechazado">rechazado</option>
        </select>
      </div>
      <div class="field">
        <label>Método</label>
        <select [(ngModel)]="filtroMetodo" (change)="cargar()">
          <option value="transferencia">transferencia</option>
          <option value="">(todos)</option>
        </select>
      </div>
      <div class="field">
        <button class="btn btn-primary" (click)="cargar()">Actualizar</button>
      </div>
    </div>
  </div>

  <div class="card" *ngIf="cargando">
    <p>Cargando pagos...</p>
  </div>

  <div class="list" *ngIf="!cargando">
    <div class="item card" *ngFor="let p of pagos">
      <div class="top">
        <div>
          <div class="title">Pago #{{ p.id }}</div>
          <div class="meta">{{ p.cliente.nombre || p.cliente.email }} · {{ p.metodo_pago_display }} · {{ p.estado_display }}</div>
        </div>
        <div class="amount">${{ p.monto.toFixed(2) }}</div>
      </div>

      <div class="row">
        <div class="field grow">
          <label>ID operación</label>
          <input type="text" [(ngModel)]="idOperacion[p.id]" placeholder="Ej. 1234567890" />
        </div>
        <div class="field">
          <button class="btn btn-primary" (click)="validar(p)" [disabled]="p.metodo_pago !== 'transferencia'">
            Validar
          </button>
        </div>
      </div>
    </div>

    <div class="card empty" *ngIf="pagos.length === 0">
      <p>No hay pagos con los filtros actuales.</p>
    </div>
  </div>
</div>
