<div class="page">
  <header class="header">
    <h1>Gestión de Productos (Stock)</h1>
    <button class="btn btn-secondary" routerLink="/secretaria/dashboard">Volver</button>
  </header>

  <div class="card herramientas">
    <div class="row">
      <div class="field">
        <label>Operación</label>
        <select [(ngModel)]="operacion">
          <option value="aumentar">aumentar</option>
          <option value="reducir">reducir</option>
        </select>
      </div>
      <div class="field">
        <label>Cantidad</label>
        <input type="number" [(ngModel)]="cantidad" />
      </div>
      <div class="field grow">
        <label>Producto ID (manual)</label>
        <input type="number" [(ngModel)]="productoIdManual" placeholder="Ej. 5" />
      </div>
      <div class="field">
        <button class="btn btn-primary" (click)="aplicarManual()">Aplicar</button>
      </div>
      <div class="field">
        <button class="btn btn-secondary" (click)="cargar()">Actualizar lista</button>
      </div>
    </div>
  </div>

  <div class="card" *ngIf="cargando">
    <p>Cargando productos bajo stock...</p>
  </div>

  <div class="list" *ngIf="!cargando">
    <div class="item card" *ngFor="let p of productos">
      <div class="top">
        <div>
          <div class="title">{{ p.nombre }} <span class="muted">(#{{ p.id }})</span></div>
          <div class="meta">Stock actual: <strong>{{ p.stock_actual }}</strong> · Mínimo: <strong>{{ p.stock_minimo }}</strong> · Faltan: <strong>{{ p.diferencia }}</strong></div>
        </div>
        <button class="btn btn-primary" (click)="aplicarStock(p.id)">Aplicar a este</button>
      </div>
    </div>

    <div class="card empty" *ngIf="productos.length === 0">
      <p>No hay productos con stock bajo.</p>
    </div>
  </div>
</div>
