<div class="profile-container">
  <!-- Toolbar -->
  <header class="profile-toolbar">
    <button type="button" class="toolbar-button" (click)="goHome()" aria-label="Volver">
      <span class="toolbar-icon">←</span>
    </button>
    <h1 class="toolbar-title">Mi Perfil</h1>
    <div class="spacer"></div>
    <button type="button" class="toolbar-button" (click)="logout()" aria-label="Cerrar sesión">
      <span class="toolbar-icon">🚪</span>
    </button>
  </header>

  <div class="profile-content">
    <!-- Información del Usuario -->
    <div class="profile-card card">
      <div class="card-header">
        <span class="header-icon">👤</span>
        <h2 class="card-title">Información Personal</h2>
      </div>

      <div class="card-content">
        <form [formGroup]="profileForm" *ngIf="currentUser">
          <div class="form-row">
            <label for="username" class="input-label">Nombre de Usuario</label>
            <div class="input-wrapper">
              <input
                id="username"
                type="text"
                formControlName="username"
                class="input-field"
                [disabled]="!editMode"
                aria-label="Nombre de usuario"
              />
            </div>
          </div>

          <div class="form-row">
            <label for="email" class="input-label">Correo Electrónico</label>
            <div class="input-wrapper">
              <input
                id="email"
                type="email"
                formControlName="email"
                class="input-field"
                [disabled]="!editMode"
                aria-label="Correo electrónico"
              />
            </div>
          </div>

          <div class="form-row">
            <label for="id" class="input-label">ID de Usuario</label>
            <div class="input-wrapper">
              <input
                id="id"
                type="text"
                formControlName="id"
                class="input-field"
                disabled
                aria-label="ID de usuario"
              />
            </div>
          </div>

          <div class="form-actions" *ngIf="!editMode">
            <button type="button" class="btn btn-primary" (click)="toggleEditMode()">
              <span>✏️</span>
              <span>Editar Perfil</span>
            </button>
          </div>

          <div class="form-actions" *ngIf="editMode">
            <button type="button" class="btn btn-primary" (click)="saveProfile()">
              <span>💾</span>
              <span>Guardar Cambios</span>
            </button>
            <button type="button" class="btn btn-secondary" (click)="toggleEditMode()">
              <span>❌</span>
              <span>Cancelar</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="actions-card card">
      <div class="card-header">
        <span class="header-icon">⚡</span>
        <h2 class="card-title">Acciones Rápidas</h2>
      </div>
      <div class="card-content">
        <div class="actions-list">
          <button type="button" class="action-item" (click)="goToChangePassword()">
            <span class="action-icon">🔑</span>
            <span class="action-text">Cambiar Contraseña</span>
            <span class="action-arrow">→</span>
          </button>

          <div class="divider"></div>

          <button type="button" class="action-item" (click)="goToSecurity()">
            <span class="action-icon">🛡️</span>
            <span class="action-text">Centro de Seguridad</span>
            <span class="action-arrow">→</span>
          </button>

          <div class="divider"></div>

          <button type="button" class="action-item" (click)="logout()">
            <span class="action-icon">🚪</span>
            <span class="action-text">Cerrar Sesión</span>
            <span class="action-arrow">→</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Información de la Cuenta -->
    <div class="info-card card">
      <div class="card-header">
        <span class="header-icon">ℹ️</span>
        <h2 class="card-title">Estado de la Cuenta</h2>
      </div>
      <div class="card-content">
        <div class="info-item">
          <span class="info-icon success">✅</span>
          <div class="info-content">
            <strong>Cuenta Verificada</strong>
            <p>Tu cuenta está verificada y activa</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="info-item">
          <span class="info-icon success">✅</span>
          <div class="info-content">
            <strong>Autenticación 2FA</strong>
            <p>Verificación de dos factores activa mediante OTP por email</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="info-item">
          <span class="info-icon">📧</span>
          <div class="info-content">
            <strong>Email de Verificación</strong>
            <p>{{ currentUser?.email }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
