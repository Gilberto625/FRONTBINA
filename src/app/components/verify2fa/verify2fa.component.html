<div class="verify-container">
  <div class="verify-card">
    <h1 class="card-title">Verificación 2FA</h1>
    <p class="card-subtitle">
      {{ type === 'register' ? 'Confirma tu registro' : 'Confirma tu identidad' }}
    </p>

    <div class="info-section">
      <p class="info-text">
        Hemos enviado un código de 6 dígitos a: <strong>{{ destination }}</strong>
      </p>
      <p class="warning-text">
        El código expira en 5 minutos
      </p>
    </div>

    <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="verify-form">
      <!-- Código de verificación -->
      <div class="form-row">
        <label for="codigo" class="input-label">Código de 6 dígitos</label>
        <div class="input-wrapper">
          <input
            id="codigo"
            type="text"
            inputmode="numeric"
            formControlName="codigo"
            placeholder="123456"
            maxlength="6"
            autocomplete="off"
            class="input-field"
            [class.input-error]="verifyForm.get('codigo')?.invalid && verifyForm.get('codigo')?.touched"
          />
          <div class="input-feedback error" *ngIf="verifyForm.get('codigo')?.hasError('required') && verifyForm.get('codigo')?.touched">
            El código es obligatorio
          </div>
          <div class="input-feedback error" *ngIf="verifyForm.get('codigo')?.hasError('pattern') && verifyForm.get('codigo')?.touched">
            Debe ser un código de 6 dígitos
          </div>
        </div>
      </div>

      <!-- Botón de envío -->
      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary submit-button"
          [disabled]="loading || verifyForm.invalid"
        >
          <span *ngIf="!loading">Verificar Código</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </div>

      <!-- Enlace de regreso -->
      <div class="back-link">
        <a routerLink="/login">← Volver al inicio de sesión</a>
      </div>
    </form>
  </div>
</div>
