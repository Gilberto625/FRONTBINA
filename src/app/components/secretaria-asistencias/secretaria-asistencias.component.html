<div class="page">
  <header class="header">
    <h1>Confirmación de Asistencias</h1>
    <button class="btn btn-secondary" routerLink="/secretaria/dashboard">Volver</button>
  </header>

  <div class="card filtros">
    <div class="row">
      <div class="field">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="fecha" (change)="cargar()" />
      </div>
      <div class="field">
        <button class="btn btn-primary" (click)="cargar()">Actualizar</button>
      </div>
    </div>
  </div>

  <div class="card" *ngIf="cargando">
    <p>Cargando citas...</p>
  </div>

  <div class="list" *ngIf="!cargando">
    <div class="item card" *ngFor="let c of citas">
      <div class="top">
        <div>
          <div class="title">Cita #{{ c.id }} · {{ formatearFechaHora(c.fecha_hora) }}</div>
          <div class="meta">{{ c.cliente.nombre || c.cliente.email }} · {{ c.servicio.nombre }} · {{ c.estado }}</div>
        </div>
      </div>
      <div class="row">
        <button class="btn btn-primary" (click)="marcar(c, true)">Asistió</button>
        <button class="btn btn-danger" (click)="marcar(c, false)">No asistió</button>
      </div>
    </div>

    <div class="card empty" *ngIf="citas.length === 0">
      <p>No hay citas para esa fecha.</p>
    </div>
  </div>
</div>
