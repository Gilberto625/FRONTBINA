<div class="modal-overlay" 
     *ngIf="isVisible" 
     (click)="onOverlayClick($event)"
     [class]="getModalClass()">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-icon">
        <i [class]="getIconClass()"></i>
      </div>
      <h2 class="modal-title">{{ modalData?.title }}</h2>
      <button class="modal-close" 
              (click)="onClose()" 
              *ngIf="modalData?.type !== 'confirm'"
              type="button">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-body">
      <p class="modal-message">{{ modalData?.message }}</p>
    </div>
    
    <div class="modal-footer">
      <div class="modal-actions" *ngIf="modalData?.showConfirm; else singleAction">
        <button class="btn btn-secondary" 
                (click)="onCancel()" 
                type="button">
          {{ modalData?.cancelText || 'Cancelar' }}
        </button>
        <button class="btn btn-primary" 
                (click)="onConfirm()" 
                type="button">
          {{ modalData?.confirmText || 'Confirmar' }}
        </button>
      </div>
      
      <ng-template #singleAction>
        <div class="modal-actions">
          <button class="btn btn-primary" 
                  (click)="onClose()" 
                  type="button">
            Aceptar
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
