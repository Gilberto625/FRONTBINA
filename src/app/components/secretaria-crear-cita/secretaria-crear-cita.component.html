<div class="page">
  <header class="header">
    <h1>Crear Cita (Secretaria)</h1>
    <button class="btn btn-secondary" routerLink="/secretaria/dashboard">Volver</button>
  </header>

  <div class="card" *ngIf="cargando">
    <p>Cargando catálogos...</p>
  </div>

  <div class="card" *ngIf="!cargando">
    <div class="grid">
      <div class="field">
        <label>Cliente ID</label>
        <input type="number" [(ngModel)]="form.cliente_id" placeholder="Ej. 12" />
        <small>No hay endpoint para buscar clientes todavía: por ahora se captura el ID.</small>
      </div>

      <div class="field">
        <label>Servicio</label>
        <select [(ngModel)]="form.servicio_id">
          <option value="">Selecciona</option>
          <option *ngFor="let s of servicios" [value]="s.id">{{ s.nombre }} ({{ s.categoria_display }})</option>
        </select>
      </div>

      <div class="field">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="form.fecha" />
      </div>

      <div class="field">
        <label>Hora</label>
        <input type="time" [(ngModel)]="form.hora" />
      </div>

      <div class="field">
        <label>Barbero (opcional)</label>
        <select [(ngModel)]="form.barbero_id">
          <option value="">Sin barbero</option>
          <option *ngFor="let b of barberos" [value]="b.id">{{ b.nombre || b.email }}</option>
        </select>
      </div>

      <div class="field">
        <label>Silla (opcional)</label>
        <select [(ngModel)]="form.silla_id">
          <option value="">Sin silla</option>
          <option *ngFor="let s of sillas" [value]="s.id">{{ s.nombre }}</option>
        </select>
      </div>

      <div class="field">
        <label>Anticipo pagado (opcional)</label>
        <input type="number" [(ngModel)]="form.anticipo_pagado" placeholder="0" />
      </div>

      <div class="field">
        <label>Método de pago anticipo (opcional)</label>
        <input type="text" [(ngModel)]="form.metodo_pago_anticipo" placeholder="efectivo / transferencia / tarjeta" />
      </div>

      <div class="field full">
        <label>Notas (opcional)</label>
        <textarea [(ngModel)]="form.notas" rows="3" placeholder="Notas internas..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="guardar()" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Crear cita' }}
      </button>
    </div>
  </div>
</div>
