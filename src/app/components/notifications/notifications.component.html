<div class="notifications-container">
  <!-- Botón de notificaciones -->
  <div class="notification-bell" (click)="toggleDropdown()">
    <i class="fas fa-bell"></i>
    <span class="notification-badge" *ngIf="noLeidas > 0">
      {{ noLeidas > 99 ? '99+' : noLeidas }}
    </span>
  </div>

  <!-- Dropdown de notificaciones -->
  <div class="notifications-dropdown" 
       *ngIf="mostrarDropdown" 
       (clickOutside)="cerrarDropdown()">
    
    <!-- Header del dropdown -->
    <div class="dropdown-header">
      <h3>Notificaciones</h3>
      <div class="header-actions">
        <button class="btn-action" 
                (click)="marcarTodasComoLeidas()" 
                *ngIf="noLeidas > 0"
                title="Marcar todas como leídas">
          <i class="fas fa-check-double"></i>
        </button>
        <button class="btn-action" 
                (click)="cargarNotificaciones()" 
                title="Actualizar">
          <i class="fas fa-sync-alt" [class.fa-spin]="cargando"></i>
        </button>
      </div>
    </div>

    <!-- Lista de notificaciones -->
    <div class="notifications-list">
      <!-- Estado de carga -->
      <div class="loading-item" *ngIf="cargando">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Cargando notificaciones...</span>
      </div>

      <!-- Notificaciones -->
      <div class="notification-item" 
           *ngFor="let notificacion of notificaciones"
           [class.unread]="!notificacion.leida"
           (click)="marcarComoLeida(notificacion)">
        
        <div class="notification-icon">
          <i [class]="getIconoTipo(notificacion.tipo)" 
             [class]="getColorTipo(notificacion.tipo)"></i>
        </div>
        
        <div class="notification-content">
          <h4 class="notification-title">{{ notificacion.titulo }}</h4>
          <p class="notification-message">{{ notificacion.mensaje }}</p>
          <span class="notification-time">{{ formatearTiempo(notificacion.fecha_creacion) }}</span>
        </div>
        
        <div class="notification-actions">
          <button class="btn-delete" 
                  (click)="eliminarNotificacion(notificacion, $event)"
                  title="Eliminar">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <!-- Estado vacío -->
      <div class="empty-notifications" *ngIf="!cargando && notificaciones.length === 0">
        <div class="empty-icon">
          <i class="fas fa-bell-slash"></i>
        </div>
        <h4>No hay notificaciones</h4>
        <p>Cuando tengas nuevas notificaciones aparecerán aquí</p>
        
        <!-- Botón de prueba (solo en desarrollo) -->
        <button class="btn btn-sm btn-outline-primary" 
                (click)="agregarNotificacionPrueba()"
                style="margin-top: 1rem;">
          <i class="fas fa-plus"></i>
          Agregar Prueba
        </button>
      </div>
    </div>

    <!-- Footer del dropdown -->
    <div class="dropdown-footer" *ngIf="notificaciones.length > 0">
      <a routerLink="/notificaciones" 
         class="btn-ver-todas"
         (click)="cerrarDropdown()">
        Ver todas las notificaciones
      </a>
    </div>
  </div>

  <!-- Overlay para cerrar dropdown -->
  <div class="dropdown-overlay" 
       *ngIf="mostrarDropdown" 
       (click)="cerrarDropdown()"></div>
</div>
