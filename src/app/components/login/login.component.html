<div class="login-container">
  <div class="login-card">
    <h1 class="card-title">Iniciar Sesión</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Correo -->
      <div class="form-row">
        <label for="email" class="input-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="juan@example.com"
            class="input-field"
            [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            [class.input-success]="loginForm.get('email')?.valid"
          />
          <div class="input-feedback" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
            El correo es obligatorio
          </div>
          <div class="input-feedback error" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
            Ingresa un correo válido
          </div>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-row">
        <label for="password" class="input-label">Contraseña</label>
        <div class="input-wrapper">
          <input
            id="password"
            type="password"
            formControlName="password"
            class="input-field"
            [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <div class="input-feedback error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            La contraseña es obligatoria
          </div>
        </div>
      </div>

      <!-- Enlace olvidaste contraseña -->
      <div class="forgot-password-link">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón de envío -->
      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary submit-button"
          [disabled]="loading || loginForm.invalid"
        >
          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </div>

      <!-- Separador -->
      <div class="divider"></div>

      <!-- Google Login -->
      <div class="google-login">
        <button
          type="button"
          class="btn btn-google google-button"
          (click)="loginWithGoogle()"
          [disabled]="loadingGoogle"
        >
          <span *ngIf="!loadingGoogle">🔐 Iniciar con Google</span>
          <span *ngIf="loadingGoogle" class="spinner"></span>
        </button>
      </div>

      <!-- Enlace de registro -->
      <div class="register-link">
        <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
