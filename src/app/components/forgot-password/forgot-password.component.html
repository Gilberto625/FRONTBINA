<div class="forgot-password-container">
  <mat-card class="forgot-password-card">
    <mat-card-header>
      <div class="header-content">
        <mat-icon class="header-icon">lock_reset</mat-icon>
        <mat-card-title>Recuperar Contraseña</mat-card-title>
        <mat-card-subtitle>Ingresa tu correo electrónico para recibir un enlace de recuperación</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            [disabled]="loading">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">
            El email es requerido
          </mat-error>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">
            Ingresa un email válido
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-button"
          [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Enviar Enlace de Recuperación</span>
        </button>

        <div class="links-container">
          <a mat-button routerLink="/login" class="back-link">
            <mat-icon>arrow_back</mat-icon>
            Volver al inicio de sesión
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
