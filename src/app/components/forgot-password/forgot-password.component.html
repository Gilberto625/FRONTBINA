<div class="forgot-password-container">
  <mat-card class="forgot-password-card">
    <mat-card-header>
      <mat-card-title>Recuperar Contraseña</mat-card-title>
      <mat-card-subtitle>Ingresa tu información para recuperar tu cuenta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            required>
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
            El correo es obligatorio
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">
            Ingresa un correo válido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Pregunta secreta</mat-label>
          <input
            matInput
            type="text"
            formControlName="preguntaSecreta"
            placeholder="¿Cuál es tu color favorito?"
            required>
          <mat-icon matPrefix>help</mat-icon>
          <mat-error *ngIf="forgotPasswordForm.get('preguntaSecreta')?.hasError('required')">
            La pregunta secreta es obligatoria
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Respuesta secreta</mat-label>
          <input
            matInput
            type="text"
            formControlName="respuestaSecreta"
            placeholder="Azul"
            required>
          <mat-icon matPrefix>vpn_key</mat-icon>
          <mat-error *ngIf="forgotPasswordForm.get('respuestaSecreta')?.hasError('required')">
            La respuesta secreta es obligatoria
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-button"
          [disabled]="isLoading || forgotPasswordForm.invalid">
          <mat-icon *ngIf="!isLoading">send</mat-icon>
          <mat-icon *ngIf="isLoading" class="spinner">refresh</mat-icon>
          {{ isLoading ? 'Procesando...' : 'Recuperar Contraseña' }}
        </button>

        <button
          mat-button
          type="button"
          class="full-width back-button"
          (click)="volverLogin()">
          <mat-icon>arrow_back</mat-icon>
          Volver al inicio de sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
